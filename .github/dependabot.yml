# Dependabot: weekly version updates for the three things this repository depends on.
#
# Each update arrives as a pull request, and `ci.yml` runs the full gate on it, so nothing
# merges on Dependabot's word alone. Minor and patch bumps are grouped into one PR per
# ecosystem to keep the noise down; a major bump gets its own PR, because that is where
# something breaks. Tauri's Rust crates and its npm packages are versioned together, so each
# side's Tauri packages move as one group.
#
# A version bump is not a new dependency, but a new *transitive* one can arrive with it:
# CLAUDE.md §1.2 still asks for its licence to be checked before merging.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
